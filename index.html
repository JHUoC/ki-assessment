  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e { background: var(--cyan); transform: scale(1.3); }\n  .step-dot.done   { background: var(--blue); }\n\n  /* ── Progress bar ────────────────────────── */\n  .progress-track {\n    height: 3px;\n    background: var(--blue-100);\n    border-radius: 2px;\n    overflow: hidden;\n    margin-bottom: 24px;\n  }\n  .progress-fill {\n    height: 100%;\n    background: var(--cyan);\n    border-radius: 2px;\n    transition: width 0.5s var(--ease);\n  }\n\n  /* ── Card ────────────────────────────────── */\n  .card {\n    background: #fff;\n    border-radius: 14px;\n    box-shadow: 0 6px 24px rgba(0,81,118,.11), 0 1px 3px rgba(0,0,0,.04);\n    overflow: hidden;\n  }\n  .card-enter {\n    animation: cardIn 0.38s var(--ease) both;\n  }\n  @keyframes cardIn {\n    from { opacity: 0; transform: translateY(20px); }\n    to   { opacity: 1; transform: translateY(0); }\n  }\n  .card-exit {\n    animation: cardOut 0.22s var(--ease) both;\n  }\n  @keyframes cardOut {\n    from { opacity: 1; transform: translateY(0); }\n    to   { opacity: 0; transform: translateY(-14px); }\n  }\n\n  /* ── Question header ─────────────────────── */\n  .q-head {\n    background: var(--blue);\n    padding: 28px 30px 24px;\n  }\n  .q-meta {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    margin-bottom: 10px;\n  }\n  .q-num {\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: rgba(255,255,255,0.55);\n  }\n  .q-hint {\n    font-size: 11px;\n    color: rgba(255,255,255,0.4);\n    letter-spacing: 0.04em;\n  }\n  .q-text {\n    font-size: 18px;\n    font-weight: 600;\n    color: #fff;\n    line-height: 1.4;\n  }\n\n  /* ── Options ─────────────────────────────── */\n  .q-body { padding: 18px 22px 24px; }\n\n  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }\n\n  .opt {\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    padding: 13px 16px;\n    border: 2px solid var(--blue-100);\n    border-radius: 9px;\n    background: #fff;\n    cursor: pointer;\n    font-family: var(--font);\n    font-size: 14.5px;\n    color: var(--gray-700);\n    line-height: 1.35;\n    text-align: left;\n    transition: border-color 0.15s, background 0.15s, transform 0.12s;\n    width: 100%;\n    position: relative;\n  }\n  .opt:hover {\n    border-color: var(--cyan);\n    background: var(--cyan-50);\n    transform: translateX(3px);\n  }\n  .opt.sel {\n    border-color: var(--blue);\n    background: var(--blue-50);\n    transform: translateX(0);\n  }\n  .opt:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }\n\n  .opt-key {\n    flex-shrink: 0;\n    width: 26px;\n    height: 26px;\n    border-radius: 6px;\n    background: var(--blue-100);\n    color: var(--blue);\n    font-size: 11px;\n    font-weight: 700;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    letter-spacing: 0.05em;\n    transition: background 0.15s, color 0.15s;\n  }\n  .opt.sel .opt-key {\n    background: var(--blue);\n    color: #fff;\n  }\n  .opt-pts {\n    margin-left: auto;\n    flex-shrink: 0;\n    font-size: 11px;\n    font-weight: 700;\n    color: var(--gray-400);\n    background: var(--gray-50);\n    border-radius: 4px;\n    padding: 2px 7px;\n    transition: color 0.15s, background 0.15s;\n  }\n  .opt.sel .opt-pts {\n    color: var(--blue);\n    background: var(--blue-100);\n  }\n\n  /* ── Next button ─────────────────────────── */\n  .btn-next {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    width: 100%;\n    padding: 13px 20px;\n    background: var(--blue);\n    color: #fff;\n    border: none;\n    border-radius: 8px;\n    font-family: var(--font);\n    font-size: 14.5px;\n    font-weight: 600;\n    cursor: pointer;\n    letter-spacing: 0.04em;\n    transition: background 0.15s, transform 0.12s, opacity 0.15s;\n  }\n  .btn-next:hover:not(:disabled) {\n    background: var(--blue-800);\n    transform: translateY(-1px);\n  }\n  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }\n\n  /* ── Result card ─────────────────────────── */\n  .result-head {\n    background: var(--blue);\n    padding: 32px 30px 28px;\n    position: relative;\n    overflow: hidden;\n  }\n  .result-head::after {\n    content: '';\n    position: absolute;\n    right: -30px;\n    top: -30px;\n    width: 160px;\n    height: 160px;\n    border-radius: 50%;\n    border: 24px solid rgba(255,255,255,0.06);\n    pointer-events: none;\n  }\n  .result-eyebrow {\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: rgba(255,255,255,0.55);\n    margin-bottom: 12px;\n  }\n  .result-score-row {\n    display: flex;\n    align-items: baseline;\n    gap: 10px;\n    margin-bottom: 10px;\n  }\n  .result-score-num {\n    font-size: 60px;\n    font-weight: 800;\n    line-height: 1;\n    color: var(--cyan);\n  }\n  .result-score-denom {\n    font-size: 18px;\n    color: rgba(255,255,255,0.45);\n    font-weight: 500;\n  }\n  .result-standort {\n    font-size: 21px;\n    font-weight: 700;\n    color: #fff;\n    line-height: 1.2;\n  }\n\n  .result-body { padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 18px; }\n\n  .section-label {\n    font-size: 10.5px;\n    font-weight: 700;\n    letter-spacing: 0.13em;\n    text-transform: uppercase;\n    color: var(--gray-400);\n    margin-bottom: 8px;\n  }\n\n  .result-desc {\n    font-size: 14.5px;\n    line-height: 1.65;\n    color: var(--gray-600);\n    text-wrap: pretty;\n  }\n\n  .divider { height: 1px; background: var(--blue-100); }\n\n  /* Score breakdown */\n  .breakdown-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 7px;\n  }\n  .breakdown-item {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    padding: 8px 12px;\n    background: var(--gray-50);\n    border-radius: 7px;\n    font-size: 13px;\n  }\n  .breakdown-label { color: var(--gray-500); }\n  .breakdown-pts { font-weight: 700; color: var(--blue); font-size: 14px; }\n\n  /* Module chips */\n  .modules-wrap { display: flex; flex-wrap: wrap; gap: 7px; }\n  .m-chip {\n    display: inline-flex;\n    align-items: center;\n    gap: 7px;\n    padding: 6px 11px 6px 7px;\n    border-radius: 6px;\n    font-size: 13px;\n    font-weight: 600;\n    border: 1.5px solid;\n  }\n  .m-chip.basis { background: var(--blue); color: #fff; border-color: var(--blue); }\n  .m-chip.orientation { background: var(--cyan-50); color: var(--cyan-700); border-color: var(--cyan); }\n  .m-chip.depth { background: var(--blue-50); color: var(--blue); border-color: var(--blue-100); }\n  .m-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.55; flex-shrink: 0; }\n\n  /* Hint box */\n  .hint-box {\n    display: flex;\n    gap: 13px;\n    align-items: flex-start;\n    padding: 15px 16px;\n    background: var(--cyan-50);\n    border-left: 4px solid var(--cyan);\n    border-radius: 0 8px 8px 0;\n  }\n  .hint-icon {\n    flex-shrink: 0;\n    width: 30px;\n    height: 30px;\n    background: var(--cyan);\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: #fff;\n    font-size: 15px;\n    font-weight: 800;\n  }\n  .hint-text { font-size: 13.5px; line-height: 1.6; color: var(--cyan-700); }\n  .hint-text strong { color: var(--blue); }\n\n  /* Reset button */\n  .btn-reset {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 7px;\n    width: 100%;\n    padding: 12px 20px;\n    background: transparent;\n    color: var(--blue);\n    border: 2px solid var(--blue-100);\n    border-radius: 8px;\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 600;\n    cursor: pointer;\n    letter-spacing: 0.03em;\n    transition: border-color 0.15s, background 0.15s;\n  }\n  .btn-reset:hover { border-color: var(--blue); background: var(--blue-50); }\n\n  .footer-note {\n    margin-top: 18px;\n    text-align: center;\n    font-size: 11.5px;\n    color: var(--gray-400);\n    letter-spacing: 0.04em;\n  }\n\n  /* ── Keyboard hint ───────────────────────── */\n  .key-hint {\n    text-align: center;\n    font-size: 11px;\n    color: var(--gray-400);\n    margin-top: 10px;\n    letter-spacing: 0.04em;\n  }\n\n  @media (max-width: 480px) {\n    body { padding: 20px 12px 40px; }\n    .q-head { padding: 22px 20px 18px; }\n    .q-text { font-size: 16px; }\n    .q-body { padding: 14px 16px 20px; }\n    .result-head { padding: 24px 20px 22px; }\n    .result-body { padding: 18px 18px 24px; }\n    .breakdown-grid { grid-template-columns: 1fr; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"shell\" id=\"app\"><\u002Fdiv>\n\n<script>\nconst Q = [\n  {\n    cat: 'Frage 1 · Erfahrung',\n    text: 'Wie viele Personen im Team haben generative KI (z. B. ChatGPT, KI:connect) schon bewusst genutzt?',\n    opts: [\n      { key:'A', pts:0, label:'Niemand im Team hat KI bislang bewusst genutzt — oder wir wissen es nicht.' },\n      { key:'B', pts:1, label:'Einzelne Kolleginnen und Kollegen haben KI bereits ausprobiert.' },\n      { key:'C', pts:2, label:'Etwa die Hälfte des Teams hat erste Erfahrungen mit KI gesammelt.' },\n      { key:'D', pts:3, label:'Die meisten im Team nutzen KI bereits regelmäßig.' }\n    ]\n  },\n  {\n    cat: 'Frage 2 · Haltung & Sicherheit',\n    text: 'Wie sicher und offen fühlt sich das Team im Umgang mit KI?',\n    opts: [\n      { key:'A', pts:0, label:'Im Team überwiegen Unsicherheit oder Skepsis gegenüber KI.' },\n      { key:'B', pts:1, label:'Wir sind neugierig, haben aber noch wenig Orientierung.' },\n      { key:'C', pts:2, label:'Das Team ist offen und hat erste Routinen im Umgang mit KI entwickelt.' },\n      { key:'D', pts:3, label:'Wir fühlen uns sicher im Umgang mit KI und möchten gezielt vertiefen.' }\n    ]\n  },\n  {\n    cat: 'Frage 3 · Anwendung im Alltag',\n    text: 'Gibt es konkrete Aufgaben, bei denen KI dem Team helfen könnte?',\n    opts: [\n      { key:'A', pts:0, label:'Wir sehen noch keine konkreten Einsatzmöglichkeiten für KI in unserem Alltag.' },\n      { key:'B', pts:1, label:'Wir haben erste Ideen, aber noch keinen konkreten Anwendungsfall.' },\n      { key:'C', pts:2, label:'Wir haben konkrete Aufgaben benannt, bei denen KI uns helfen könnte.' },\n      { key:'D', pts:3, label:'KI wird im Team bereits punktuell für bestimmte Aufgaben eingesetzt.' }\n    ]\n  },\n  {\n    cat: 'Frage 4 · Recht & Reflexion',\n    text: 'Wie steht es um Datenschutz-, Bias- und Rechtsbewusstsein im Team?',\n    opts: [\n      { key:'A', pts:0, label:'Diese Themen wurden im Team bislang kaum thematisiert.' },\n      { key:'B', pts:1, label:'Wir haben ein grobes Bewusstsein dafür, aber noch kein tieferes Wissen.' },\n      { key:'C', pts:2, label:'Im Team besteht ein solides Grundwissen zu Datenschutz, Bias und Recht.' },\n      { key:'D', pts:3, label:'Wir haben klare Teamregeln zu diesen Themen entwickelt und etabliert.' }\n    ]\n  }\n];\n\nconst RESULTS = [\n  {\n    range: [0,3],\n    standort: 'Ganz am Anfang',\n    desc: 'Ihr Team steht am Beginn der KI-Reise — das ist ein guter Ausgangspunkt. Starten Sie ohne Druck: Das Basismodul schafft das gemeinsame Fundament, danach führen die ersten Orientierungsbausteine behutsam in die Praxis ein.',\n    modules: [\n      { code:'Basismodul', label:'Pflicht · Einstieg', t:'basis' },\n      { code:'O1', label:'Begriffe & Grundlagen', t:'orientation' },\n      { code:'O2', label:'Erste Schritte', t:'orientation' },\n      { code:'O3', label:'Ausprobieren', t:'orientation' }\n    ]\n  },\n  {\n    range: [4,7],\n    standort: 'Orientierungsphase',\n    desc: 'Ihr Team hat Interesse und erste Berührungspunkte — jetzt geht es darum, konkrete Anwendungsfälle zu erschließen und Sicherheit zu gewinnen. Die Orientierungsbausteine O4–O6 bauen systematisch auf dem Basismodul auf.',\n    modules: [\n      { code:'Basismodul', label:'Pflicht · Fundament', t:'basis' },\n      { code:'O4', label:'Prompting', t:'orientation' },\n      { code:'O5', label:'Verwaltungsalltag', t:'orientation' },\n      { code:'O6', label:'Qualität & Grenzen', t:'orientation' }\n    ]\n  },\n  {\n    range: [8,10],\n    standort: 'Anwendungsbereit',\n    desc: 'Ihr Team ist bereit für den nächsten Schritt: Von der Orientierung in die kritische Reflexion und erste Vertiefung. Nach dem Basismodul empfehlen sich O7 (Recht & Ethik) und ein Einstieg in die Vertiefungsbausteine.',\n    modules: [\n      { code:'Basismodul', label:'Pflicht · Auffrischung', t:'basis' },\n      { code:'O7', label:'Recht & Ethik', t:'orientation' },\n      { code:'V1+', label:'Vertiefungsbausteine', t:'depth' }\n    ]\n  },\n  {\n    range: [11,12],\n    standort: 'Fortgeschritten',\n    desc: 'Ihr Team verfügt über solide Grundlagen und aktive Praxis. Das Basismodul bleibt Pflicht als gemeinsamer Bezugspunkt — danach empfiehlt sich ein direkter Einstieg in die Vertiefungsbausteine nach thematischem Bedarf.',\n    modules: [\n      { code:'Basismodul', label:'Pflicht · Check', t:'basis' },\n      { code:'V1', label:'Vertiefung nach Bedarf', t:'depth' },\n      { code:'V2–V8', label:'Thematisch wählen', t:'depth' }\n    ]\n  }\n];\n\nconst Q_LABELS = ['Erfahrung','Haltung','Anwendung','Recht & Reflexion'];\n\n// State\nlet step = 0;\nlet pts = [null,null,null,null];\nlet keys = [null,null,null,null];\nlet animating = false;\n\nfunction getResult(total) {\n  return RESULTS.find(r => total >= r.range[0] && total <= r.range[1]);\n}\n\nfunction pct() { return (step / Q.length) * 100; }\n\nfunction dots() {\n  return Q.map((_,i) => {\n    let cls = i < step ? 'done' : i === step ? 'active' : '';\n    return `<span class=\"step-dot ${cls}\"><\u002Fspan>`;\n  }).join('');\n}\n\nfunction renderQ() {\n  const q = Q[step];\n  const sel = keys[step];\n  return `\n    <div class=\"topbar\">\n      <span class=\"brand\">UzK · KI-Assessment<\u002Fspan>\n      <div class=\"step-indicator\">${dots()}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:${pct()}%\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card card-enter\">\n      <div class=\"q-head\">\n        <div class=\"q-meta\">\n          <span class=\"q-num\">${q.cat}<\u002Fspan>\n          <span class=\"q-hint\">Teamentscheid<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-text\">${q.text}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"q-body\">\n        <div class=\"options\">\n          ${q.opts.map(o => `\n            <button class=\"opt ${sel===o.key?'sel':''}\"\n              onclick=\"select('${o.key}',${o.pts})\"\n              data-key=\"${o.key}\"\n              aria-pressed=\"${sel===o.key}\">\n              <span class=\"opt-key\">${o.key}<\u002Fspan>\n              <span>${o.label}<\u002Fspan>\n\n            <\u002Fbutton>\n          `).join('')}\n        <\u002Fdiv>\n        <button class=\"btn-next\" onclick=\"advance()\" id=\"btn-next\" ${sel===null?'disabled':''}>\n          ${step < Q.length-1 ? 'Weiter →' : 'Auswertung anzeigen →'}\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"key-hint\">Tastatur: A / B / C / D wählen · Enter bestätigen<\u002Fdiv>\n  `;\n}\n\nfunction renderResult() {\n  const total = pts.reduce((s,v)=>s+v,0);\n  const r = getResult(total);\n  return `\n    <div class=\"topbar\">\n      <span class=\"brand\">UzK · KI-Assessment<\u002Fspan>\n      <div class=\"step-indicator\">${Q.map(()=>'<span class=\"step-dot done\"><\u002Fspan>').join('')}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card card-enter\">\n      <div class=\"result-head\">\n        <div class=\"result-eyebrow\">Ihr Teamergebnis<\u002Fdiv>\n        <div class=\"result-score-row\">\n          <span class=\"result-score-num\">${total}<\u002Fspan>\n          <span class=\"result-score-denom\">/ 12 Punkte<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"result-standort\">${r.standort}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"result-body\">\n\n        <div>\n          <div class=\"section-label\">Einschätzung<\u002Fdiv>\n          <p class=\"result-desc\">${r.desc}<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"divider\"><\u002Fdiv>\n\n        <div>\n          <div class=\"section-label\">Ihre Antworten<\u002Fdiv>\n          <div class=\"breakdown-grid\">\n            ${Q_LABELS.map((l,i)=>`\n              <div class=\"breakdown-item\">\n                <span class=\"breakdown-label\">${l}<\u002Fspan>\n                <span class=\"breakdown-pts\">${pts[i]} Pt.<\u002Fspan>\n              <\u002Fdiv>\n            `).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"divider\"><\u002Fdiv>\n\n        <div>\n          <div class=\"section-label\">Empfohlene Bausteine<\u002Fdiv>\n          <div class=\"modules-wrap\">\n            ${r.modules.map(m=>`\n              <span class=\"m-chip ${m.t}\">\n                <span class=\"m-chip-dot\"><\u002Fspan>\n                <strong>${m.code}<\u002Fstrong>&thinsp;·&thinsp;${m.label}\n              <\u002Fspan>\n            `).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"divider\"><\u002Fdiv>\n\n        <div class=\"hint-box\">\n          <div class=\"hint-icon\">!<\u002Fdiv>\n          <div class=\"hint-text\">\n            <strong>Das Basismodul ist immer der erste Schritt<\u002Fstrong> — unabhängig vom Ergebnis.\n            Es schafft das gemeinsame Fundament für alle weiteren Bausteine und dauert 45–60&thinsp;Min.\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button class=\"btn-reset\" onclick=\"reset()\">\n          <span style=\"font-size:17px;line-height:1\">↺<\u002Fspan> Assessment wiederholen\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-note\">Universität zu Köln · Prorektorat für Lehre und Studium<\u002Fdiv>\n  `;\n}\n\nfunction render(html) {\n  document.getElementById('app').innerHTML = html;\n  notifyHeight();\n  if (step < Q.length) setupKeyboard();\n}\n\nfunction select(k, p) {\n  keys[step] = k;\n  pts[step] = p;\n  render(renderQ());\n}\n\nfunction advance() {\n  if (keys[step] === null || animating) return;\n  animating = true;\n  // brief exit animation\n  const card = document.querySelector('.card');\n  if (card) {\n    card.classList.remove('card-enter');\n    card.classList.add('card-exit');\n    setTimeout(()=>{ step++; render(step < Q.length ? renderQ() : renderResult()); animating=false; }, 200);\n  } else {\n    step++;\n    render(step < Q.length ? renderQ() : renderResult());\n    animating = false;\n  }\n}\n\nfunction reset() {\n  step = 0;\n  pts = [null,null,null,null];\n  keys = [null,null,null,null];\n  render(renderQ());\n}\n\nfunction setupKeyboard() {\n  const handler = (e) => {\n    const k = e.key.toUpperCase();\n    if (['A','B','C','D'].includes(k)) {\n      const q = Q[step];\n      const opt = q.opts.find(o => o.key === k);\n      if (opt) { select(opt.key, opt.pts); }\n    }\n    if ((e.key === 'Enter' || e.key === ' ') && keys[step] !== null) {\n      e.preventDefault();\n      advance();\n    }\n  };\n  document.addEventListener('keydown', handler, { once: false });\n  // Clean up on next render by storing ref\n  window.__kbHandler = handler;\n}\n\n// Remove old keyboard handler before re-attaching\nconst origRender = render;\nfunction render(html) {\n  if (window.__kbHandler) {\n    document.removeEventListener('keydown', window.__kbHandler);\n    window.__kbHandler = null;\n  }\n  document.getElementById('app').innerHTML = html;\n  notifyHeight();\n  if (step < Q.length) setupKeyboard();\n}\n\nfunction notifyHeight() {\n  setTimeout(() => {\n    const h = document.documentElement.scrollHeight;\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage({ subject:'lti.frameResize', height:h }, '*');\n      window.parent.postMessage({ type:'resize', height:h }, '*');\n    }\n  }, 120);\n}\n\n// Init\nrender(renderQ());\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
